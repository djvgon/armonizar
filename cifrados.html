<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Práctica armónica · Cuadro de cifrados</title>
  <meta name="description" content="Cada cifrado interválico con el acorde que produce en Do mayor, a cuatro voces y con sonido.">
  <meta property="og:title" content="Práctica armónica · Cuadro de cifrados">
  <meta property="og:description" content="Cada cifrado interválico con el acorde que produce en Do mayor.">
  <link rel="stylesheet" href="css/bravura.css?v=20260930-2230">
  <link rel="stylesheet" href="css/estilo.css?v=20260930-2230">
  <style>
    body { max-width: 1500px; }
    .cuadro { padding: 0 14px 26px; max-width: 1500px; margin: 0 auto; font-size: .92rem; }
    /* La cabecera se queda pegada arriba, como en la ventana de estructuras */
    /* La banda de esta ventana, además, se queda pegada arriba al desplazar: es la que
       dice de qué tema son las estructuras que estás mirando. El color y el texto los pone
       ya `estilo.css`; aquí solo se añade que sea pegajosa. */
    .cabecera { position: sticky; top: 0; z-index: 30;
                align-items: center; gap: 10px 16px; }
    .mandos-ayuda { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; flex-wrap: wrap;
                    justify-content: flex-end; }
    .mandos-ayuda label { display: flex; align-items: center; gap: 6px;
                          font-size: .78rem; text-transform: uppercase; letter-spacing: .04em;
                          color: var(--tinta-suave); }
    #posicion { display: flex; gap: 0; }
    #posicion button { font: inherit; font-family: var(--fuente-ui); font-size: .82rem; padding: 4px 9px; cursor: pointer;
                       border: 1px solid var(--linea); background: var(--papel); color: var(--tinta); }
    #posicion button:first-child { border-radius: var(--radio-control) 0 0 var(--radio-control); }
    #posicion button:last-child { border-radius: 0 var(--radio-control) var(--radio-control) 0; }
    #posicion button.elegida { background: var(--acento); border-color: var(--acento); color: #fff; }
    .btn-volver { font: inherit; font-family: var(--fuente-ui); font-size: .86rem; padding: 6px 14px; border-radius: var(--radio-control);
                  border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
    #titulo { margin: 0; }
    #titulo .quees { font-weight: 400; font-size: .72em; letter-spacing: .02em; opacity: .82; }
    .esquema { margin: 0 0 5px; padding: 4px 10px; background: transparent; border-bottom: 1px solid var(--linea); border-radius: 0;
               font-size: .92rem; letter-spacing: .02em; }
    .esquema .acorde-familia { font-size: .74rem; font-style: italic; color: var(--tinta-suave); }
    .piezas { display: flex; flex-wrap: wrap; gap: 18px 26px; align-items: flex-start; }
    .pieza { display: flex; flex-direction: column; flex: 0 0 auto; min-width: 0; max-width: 100%; }
    /* La tira de botones es un renglón de alto con cada botón colocado sobre su acorde */
    .cabeza-pieza { position: relative; height: 24px; margin-bottom: 1px; }
    .btn-acorde { position: absolute; top: 0; padding: 0; width: 24px; height: 22px;
                  display: inline-flex; align-items: center; justify-content: center;
                  font-size: .7rem; }
    .pieza .pent { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .pieza .pent svg { max-width: none; height: auto; }
    .btn-sonar { font: inherit; font-family: var(--fuente-ui); font-size: .74rem; line-height: 1.5; padding: 2px 9px;
                 border-radius: var(--radio-control); cursor: pointer; flex: 0 0 auto; white-space: nowrap; align-self: flex-start; }
    
    .btn-sonar.sonando { background: var(--marca); color: var(--marca-texto); border-color: var(--marca); }
    #aviso { margin: 16px; color: #8a2b2b; }
  </style>
</head>
<body>
  <nav class="barra-app" aria-label="Secciones">
    <span class="marca" title="Práctica armónica"><svg class="logo-nota" viewBox="0 0 26 24" width="26" height="24" aria-hidden="true" focusable="false"><polygon points="9.4,3.6 23.2,0.8 23.2,5.0 9.4,7.8"/><rect x="8.0" y="3.6" width="1.6" height="13.4"/><rect x="21.6" y="0.8" width="1.6" height="13.4"/><ellipse cx="5.0" cy="17.6" rx="3.9" ry="2.8" transform="rotate(-20 5 17.6)"/><ellipse cx="18.6" cy="14.8" rx="3.9" ry="2.8" transform="rotate(-20 18.6 14.8)"/></svg></span>
    <a href="index.html">Ejercicio</a>
    <a href="estructuras.html">Estructuras</a>
    <a href="cifrados.html" class="aqui">Cifrados</a>
  </nav>

  <header class="cabecera">
    <div class="cabecera-texto">
      <h1 id="titulo">Cuadro de cifrados <span class="quees">— cada cifrado interválico y el acorde que manda escribir, en Do mayor</span></h1>
    </div>
    <div class="mandos-ayuda">
      <label>Posición melódica
        <span id="posicion">
          <button type="button" data-rot="0" class="elegida" title="La soprano lleva la fundamental del acorde (posición de octava)">Fund.</button>
          <button type="button" data-rot="1" title="La soprano lleva la tercera del acorde (posición de décima)">3.ª</button>
          <button type="button" data-rot="2" title="La soprano lleva la quinta del acorde">5.ª</button>
        </span>
      </label>
      <label>Instrumento
        <select id="instrumento" aria-label="Elegir instrumento"></select>
      </label>
      <button type="button" id="btn-volver" class="btn-volver" title="Volver a la práctica">Cerrar &#10005;</button>
    </div>
  </header>

  <div class="envoltorio">
    <p class="instruccion">Dentro de cada familia es siempre el mismo acorde, visto desde cada uno de sus bajos. Pulsa <b>Escuchar</b> para oírlo.</p>


  <p id="aviso" hidden></p>
  <main class="cuadro" id="cuadro"></main>

  <noscript><p class="instruccion" style="margin:24px 16px">Esta página necesita JavaScript.</p></noscript>
  </div>

  <script src="js/teoria.js?v=20260930-2230"></script>
  <script src="js/reglas.js?v=20260930-2230"></script>
  <script src="js/ejercicios.js?v=20260930-2230"></script>
  <script src="js/partitura.js?v=20260930-2230"></script>
  <script src="js/realizacion.js?v=20260930-2230"></script>
  <script src="js/tecnicas.js?v=20260930-2230"></script>
  <script src="js/sonido.js?v=20260930-2230"></script>
  <script src="js/cifrados.js?v=20260930-2230"></script>
</body>
</html>
