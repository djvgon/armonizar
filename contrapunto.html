<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- La página del tipo de ejercicio «Contrapunto»: retardos a dos voces (y, más
       adelante, cadenas y esquemas). A diferencia de las otras cuatro portadas, esta NO
       reenvía a index.html: la reja de escritura no tiene nada que ver con las casillas de
       cifrado, así que el ejercicio vive aquí. El título es además el que Classroom pone
       como etiqueta del enlace (decisión 58). -->
  <title>Práctica armónica · Contrapunto</title>
  <meta name="description" content="Escribe retardos a dos voces: la preparación, la disonancia en parte fuerte y su resolución.">
  <meta property="og:title" content="Práctica armónica · Contrapunto">
  <meta property="og:description" content="Escribe retardos a dos voces: la preparación, la disonancia en parte fuerte y su resolución.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/bravura.css?v=20261017-0030">
  <link rel="stylesheet" href="css/estilo.css?v=20261017-0030">
  <style>
    .mandos-cp { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin: 10px 0 16px; }
    .mandos-cp label { font-size: .85rem; }
    .mandos-cp .control-etiqueta { display: block; opacity: .75; }
    .enunciado { font-size: 1.15rem; margin: 0 0 4px; }
    .tipo-pedido { font-size: .9rem; opacity: .8; margin: 0 0 12px; }
    .obra { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 4px; }
    .momentos-cp { font-size: .9rem; margin: 10px 0 0; }
    .momentos-cp b { font-weight: 600; }
  </style>
</head>
<body>
  <nav class="barra-app" aria-label="Secciones">
    <span class="marca" title="Práctica armónica"><svg class="logo-nota" viewBox="0 0 26 24" width="26" height="24" aria-hidden="true" focusable="false"><polygon points="9.4,3.6 23.2,0.8 23.2,5.0 9.4,7.8"/><rect x="8.0" y="3.6" width="1.6" height="13.4"/><rect x="21.6" y="0.8" width="1.6" height="13.4"/><ellipse cx="5.0" cy="17.6" rx="3.9" ry="2.8" transform="rotate(-20 5 17.6)"/><ellipse cx="18.6" cy="14.8" rx="3.9" ry="2.8" transform="rotate(-20 18.6 14.8)"/></svg></span>
    <a href="index.html">Ejercicio</a>
    <a href="contrapunto.html" class="aqui">Contrapunto</a>
    <a href="estructuras.html">Estructuras</a>
    <a href="cifrados.html">Cifrados</a>
  </nav>

  <header class="cabecera">
    <div class="cabecera-texto">
      <!-- En la banda morada el «sobretítulo» no se ve (lo esconde la hoja de estilo), así
           que la lección va al lado del título, como el selector en las otras pantallas. -->
      <h1 id="titulo">Contrapunto</h1>
      <span class="leccion-cabecera" id="leccion"></span>
    </div>
  </header>

  <div class="envoltorio">

    <div class="mandos-cp" id="mandos">
      <label>
        <span class="control-etiqueta">Ejercicio</span>
        <select id="ejercicio">
          <option value="celula">Retardo suelto</option>
          <option value="cadena">Cadena de retardos</option>
        </select>
      </label>
      <label id="caja-tipo">
        <span class="control-etiqueta">Tipo de retardo</span>
        <select id="tipo"></select>
      </label>
      <label>
        <span class="control-etiqueta">Tonalidad</span>
        <select id="ton"></select>
      </label>
      <label id="caja-dada">
        <span class="control-etiqueta">Qué nota se da</span>
        <select id="dada">
          <option value="ambas">Las dos direcciones</option>
          <option value="retardada">La nota retardada</option>
          <option value="real">La nota real</option>
        </select>
      </label>
      <label id="caja-nivel">
        <span class="control-etiqueta">Dificultad</span>
        <select id="nivel">
          <option value="facil">Se dice el tipo de retardo</option>
          <option value="dificil">No se dice el tipo</option>
        </select>
      </label>
      <label>
        <span class="control-etiqueta">Instrumentación</span>
        <select id="inst"></select>
      </label>
    </div>

    <p class="enunciado" id="enunciado"></p>
    <p class="tipo-pedido" id="tipo-pedido"></p>

    <div class="reja-caja" id="reja" aria-live="polite"></div>

    <!-- La reja de escritura (2.6): el ritmo lo da el ejercicio, el alumno pone alturas,
         ligaduras y la barra. Las flechas mueven la nota UN GRADO DE LA ESCALA, que es
         pensar en melódico y no en semitonos. -->
    <div class="mandos-nota" id="mandos-nota" role="group" aria-label="Escribir el retardo">
      <span class="casilla-dice" id="casilla-dice">Pulsa una casilla del pentagrama</span>
      <span class="grupo-botones">
        <button type="button" id="subir" title="Subir un grado de la escala (flecha arriba)" aria-label="Subir un grado">↑</button>
        <button type="button" id="bajar" title="Bajar un grado de la escala (flecha abajo)" aria-label="Bajar un grado">↓</button>
        <button type="button" id="alterar" title="Elevar o volver natural el 6.º o el 7.º grado del menor (tecla S)">♯ / ♮</button>
        <button type="button" id="ligar" title="Ligar esta nota con la siguiente de su voz (tecla L)">Ligar</button>
        <button type="button" id="borrar" title="Quitar esta nota (Retroceso)">Borrar</button>
      </span>
    </div>
    <p class="instruccion" id="pista-barra">La <b>barra de compás</b> la pones tú: pulsa el hueco
      entre dos notas para ponerla o quitarla.</p>

    <!-- QUIÉN ES QUIÉN, al corregir (Diego, 16/10/2026): el comentario nombra la nota real y
         la retardada, y dice cuál de las dos no es la que pedía el retardo. -->
    <p class="papeles-cp" id="papeles" hidden></p>
    <ul class="mensajes-cp" id="mensajes" hidden aria-live="polite"></ul>
    <p class="momentos-cp" id="momentos" hidden></p>

    <div class="botonera obra">
      <button type="button" id="comprobar" class="primario">Comprobar</button>
      <button type="button" id="oir">▶ Oír</button>
      <button type="button" id="parar" hidden>■ Parar</button>
      <button type="button" id="ver">Ver la solución</button>
      <button type="button" id="otra" class="secundario">Otro retardo</button>
    </div>

    <p class="instruccion" id="paso"></p>
  </div>

  <!-- EL FINAL DE LA FICHA (decisión 264): la puntuación, el desglose ejercicio a ejercicio
       y las dos salidas —enviarlo al profesor o repetir la ficha para mejorarla—. Es la
       misma caja y los mismos estilos que la de la práctica armónica. -->
  <section id="resultado" class="resultado" hidden aria-live="polite"></section>

  <div id="aviso" class="aviso" hidden></div>

  <script src="js/teoria.js?v=20261017-0030"></script>
  <script src="js/sonido.js?v=20261017-0030"></script>
  <!-- `banco.js` se carga por tres cosas: leer la ficha de la dirección (`#f=`), el título de
       la lección y su rótulo. Y pide `ejercicios.js` delante, que es de quien lee el orden de
       las cifras al cargarse. -->
  <script src="js/ejercicios.js?v=20261017-0030"></script>
  <script src="js/banco.js?v=20261017-0030"></script>
  <script src="js/celulas.js?v=20261017-0030"></script>
  <script src="js/cadenas.js?v=20261017-0030"></script>
  <script src="js/reja.js?v=20261017-0030"></script>
  <!-- El registro de lo que hace el alumno y el envío al formulario del profesor: los
       mismos de la práctica armónica, para que las filas lleguen al mismo cuaderno. -->
  <script src="js/registro.js?v=20261017-0030"></script>
  <script src="js/envio.js?v=20261017-0030"></script>
  <script src="js/contrapunto.js?v=20261017-0030"></script>
</body>
</html>
