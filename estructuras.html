<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Práctica armónica · Estructuras armónicas del tema</title>
  <meta name="description" content="Las estructuras armónicas con las que se resuelven los ejercicios de cada tema, con su realización a cuatro voces y un botón para escucharlas.">
  <meta property="og:title" content="Práctica armónica · Estructuras armónicas del tema">
  <meta property="og:description" content="Las estructuras armónicas con las que se resuelven los ejercicios de cada tema.">
  <link rel="stylesheet" href="css/bravura.css?v=20260928-0145">
  <link rel="stylesheet" href="css/estilo.css?v=20260928-0145">
  <style>
    /* La ventana de ayuda tiene su propio aire: aquí no se escribe, solo se mira y se
       escucha, así que los fragmentos van más sueltos que en la hoja de ejercicios. */
    .cuadro { padding: 0 14px 26px; max-width: 1180px; margin: 0 auto; font-size: .92rem; }
    .esquema { margin: 13px 0 4px; padding: 3px 10px; background: #f2ede3; border-radius: 4px;
               font-size: .85rem; letter-spacing: .02em; }
    .renglon { border-top: 1px dotted #c9c0b2; padding: 7px 0 2px; }
    .esquema + .renglon { border-top: 0; }
    .estructura { font-weight: 700; font-size: .92rem; margin-bottom: 3px; }
    .piezas { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: flex-start; }
    /* Cada fragmento ocupa lo suyo y se encoge si no cabe; así los cortos se ponen dos
       por renglón y uno solo no se infla hasta el ancho de la página. */
    .pieza { display: flex; flex-direction: column; flex: 0 1 470px; min-width: 0;
             max-width: min(100%, 470px); }
    .pieza.larga { flex-basis: 100%; max-width: 100%; }
    .cabeza-pieza { display: flex; margin-bottom: 1px; }
    .pieza .pent { overflow-x: auto; }
    .pieza .pent svg { max-width: 100%; height: auto; }
    .pie-pieza { margin-top: 0; }
    .pie-pieza .var { font-style: italic; color: #7a6a55; font-size: .78rem; }
    .btn-sonar { font: inherit; font-size: .74rem; line-height: 1.5; padding: 1px 9px;
                 border-radius: 999px; border: 1px solid #b9ad99; background: #fff;
                 cursor: pointer; }
    .btn-sonar:hover { background: #f4efe6; }
    .btn-sonar.sonando { background: #2f2a22; color: #fff; border-color: #2f2a22; }
    #aviso { margin: 16px; color: #8a2b2b; }
  </style>
</head>
<body>

  <header class="cabecera">
    <div class="cabecera-texto">
      <p class="sobretitulo">Armonización con cifrado barroco</p>
      <h1 id="titulo">Estructuras armónicas</h1>
      <p class="instruccion"><b>Las estructuras armónicas de este tema.</b> Los ejercicios de la lección se resuelven con ellas. Pulsa <b>Escuchar</b> para oír cualquiera.</p>
    </div>
    <label class="selector-caja">
      <span>Tema</span>
      <select id="tema" aria-label="Elegir tema"></select>
    </label>
  </header>

  <p id="aviso" hidden></p>
  <main class="cuadro" id="cuadro"></main>

  <noscript><p class="instruccion" style="margin:24px 16px">Esta página necesita JavaScript.</p></noscript>

  <script src="js/teoria.js?v=20260928-0145"></script>
  <script src="js/reglas.js?v=20260928-0145"></script>
  <script src="js/ejercicios.js?v=20260928-0145"></script>
  <script src="js/partitura.js?v=20260928-0145"></script>
  <script src="js/realizacion.js?v=20260928-0145"></script>
  <script src="js/sonido.js?v=20260928-0145"></script>
  <script src="js/estructuras.js?v=20260928-0145"></script>
</body>
</html>
